[package]
name = "harness-bridge"
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-or-later"
default-run = "harness-bridge"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
regex = "1"
similar = "2"

[[bin]]
name = "harness-bridge"
path = "src/main.rs"

[[bin]]
name = "bridge-host"
path = "src/bin/bridge-host.rs"
